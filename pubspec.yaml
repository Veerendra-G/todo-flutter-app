name: todo_app
description: "A modern, beautiful, and feature-rich Material 3 Todo Android application built with Flutter."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Persistence
  shared_preferences: ^2.2.3

  # Date formatting & internationalization
  intl: ^0.19.0

  # Unique ID generator
  uuid: ^4.3.3

  # Icons and aesthetics
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
